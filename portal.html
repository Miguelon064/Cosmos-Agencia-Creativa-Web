<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Portal · Cosmos Agencia Creativa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
:root{--neon:#c8ff00;--magenta:#ff0098;--azul:#0068ff;--morado:#3e007a}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{font-family:'Montserrat',sans-serif;font-weight:500;color:var(--morado);background:#fff;min-height:100vh}
button{font-family:inherit;cursor:pointer}
a{color:inherit}
h1,h2,h3{font-weight:900;text-transform:uppercase;line-height:1.08}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;text-decoration:none;font-weight:700;font-size:15px;padding:12px 24px;border-radius:999px;transition:transform .2s;cursor:pointer}
.btn:hover{transform:translateY(-2px)}
.btn[disabled],.btn.off{opacity:.4;pointer-events:none}
.btn svg{width:20px;height:20px}
.b-mag{background:var(--magenta);color:#fff}.b-mor{background:var(--morado);color:var(--neon)}
.b-out{background:#fff;color:var(--morado);border:2.5px solid var(--morado)}.b-neon{background:var(--neon);color:var(--morado)}
@keyframes float{0%,100%{transform:translate3d(0,0,0) rotate(0)}25%{transform:translate3d(1.2%,-3%,0) rotate(1.2deg)}50%{transform:translate3d(0,-5%,0)}75%{transform:translate3d(-1.2%,-2.5%,0) rotate(-1.2deg)}}
.fl{position:absolute;animation:float var(--d,6s) ease-in-out var(--dl,0s) infinite}

/* ===== Acceso ===== */
.auth{min-height:100vh;display:grid;grid-template-columns:1fr 1fr}
.auth-l{position:relative;overflow:hidden;background:linear-gradient(180deg,#6d36a3,#55208f);display:flex;flex-direction:column;justify-content:center;padding:6vw;color:#fff}
.auth-l>*:not(.fl){position:relative;z-index:1}
.auth-l .lg{width:min(280px,60%);margin-bottom:34px}
.auth-l h1{font-size:clamp(30px,3.6vw,56px)}.auth-l h1 span{color:var(--neon)}
.auth-l p{margin-top:18px;font-size:clamp(15px,1.2vw,19px);max-width:420px;line-height:1.6}
.auth-r{display:flex;align-items:center;justify-content:center;padding:6vw 4vw}
.card-a{width:min(440px,100%)}
.card-a h2{font-size:clamp(26px,2.4vw,36px);margin-bottom:6px}
.card-a .sub{margin-bottom:22px;line-height:1.5}
.tabs{display:flex;gap:6px;background:#f1e9fa;padding:6px;border-radius:999px;margin-bottom:24px}
.tabs button{flex:1;border:0;background:none;padding:12px;border-radius:999px;font-weight:700;color:var(--morado);font-size:15px}
.tabs button.on{background:var(--morado);color:var(--neon)}
.fld{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
label{font-weight:700;font-size:13px}
input,select,textarea{font:inherit;font-weight:500;color:var(--morado);border:2.5px solid var(--morado);border-radius:16px;padding:12px 16px;width:100%;background:#fff;outline:0}
input:focus,select:focus,textarea:focus{border-color:var(--magenta)}
input[type=checkbox]{width:auto;accent-color:var(--magenta)}
.msg{min-height:20px;font-size:13px;font-weight:700;color:var(--magenta);margin:4px 0 10px}
.full{width:100%}
.or{display:flex;align-items:center;gap:12px;margin:18px 0;font-size:13px;font-weight:700}
.or::before,.or::after{content:"";flex:1;height:2px;background:#e6d9f5}
.google{width:100%;background:#fff;color:var(--morado);border:2.5px solid var(--morado)}
.google svg{width:22px;height:22px}

/* ===== Cabecera ===== */
.top{position:sticky;top:0;z-index:30;height:76px;background:#fff;border-bottom:3px solid var(--morado);display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:0 3vw}
.top .brand img{height:40px;display:block}
.top .r{display:flex;gap:12px;justify-content:flex-end;align-items:center}
.top .l a{font-weight:700;text-decoration:none;font-size:15px}.top .l a:hover{color:var(--magenta)}
.hi{font-weight:700}.tag{background:var(--neon);color:var(--morado);font-size:11px;font-weight:900;text-transform:uppercase;padding:4px 10px;border-radius:999px;margin-left:6px}

/* ===== Páginas ===== */
.wrap{max-width:1200px;margin:0 auto;padding:36px 5vw 90px}
.wrap.narrow{max-width:1020px}
.crumb{font-weight:700;color:var(--magenta);text-transform:uppercase;font-size:13px;letter-spacing:.08em;margin-bottom:8px}
.sec-h{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:26px}
.sec-h h1{font-size:clamp(28px,3.6vw,52px)}
.lead{font-size:clamp(15px,1.25vw,19px);line-height:1.65;max-width:760px;margin-bottom:30px}
.banner{position:relative;height:clamp(190px,24vw,300px);border:3px solid var(--morado);border-radius:32px;overflow:hidden;max-width:1100px;margin:0 auto 46px}
.bs{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;padding:0 clamp(24px,5vw,70px);opacity:0;transition:opacity .7s;pointer-events:none}
.bs.on{opacity:1}
.bs h2{font-size:clamp(20px,3vw,44px);max-width:58%}
.bs p{margin-top:10px;font-size:clamp(13px,1.2vw,18px);max-width:52%;font-weight:700}
.bs img{position:absolute;right:5%;top:14%;height:72%;width:auto}
.bdots{position:absolute;left:0;right:0;bottom:12px;display:flex;justify-content:center;gap:8px}
.bdots i{width:10px;height:10px;border-radius:50%;background:var(--morado);opacity:.35;cursor:pointer;transition:all .3s}
.bdots i.on{opacity:1;width:28px;border-radius:6px}
.h-mod{font-size:clamp(22px,2.4vw,34px);margin-bottom:22px}
.mods{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:24px}
.mod{position:relative;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end;text-decoration:none;border:3px solid var(--c);background:#fff;border-radius:30px;padding:30px 28px;min-height:230px;transition:transform .25s}
.mod:hover{transform:translateY(-6px)}
.mod h3{color:var(--c);font-size:clamp(22px,2vw,30px);margin-bottom:8px}
.mod p{line-height:1.5;font-size:15px}
.mod img{position:absolute;right:18px;top:16px;width:84px;height:84px;object-fit:contain}
.mod.adm{background:var(--morado);--c:var(--neon)}.mod.adm p{color:#fff}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:24px}
.course{position:relative;display:flex;flex-direction:column;text-decoration:none;border:3px solid var(--c,var(--morado));border-radius:28px;padding:30px 28px;min-height:270px}
.course.on{background:var(--morado);color:#fff;transition:transform .25s}.course.on:hover{transform:translateY(-6px)}
.course.soon{border-style:dashed}
.badge{align-self:flex-start;font-weight:900;text-transform:uppercase;font-size:12px;letter-spacing:.06em;padding:7px 14px;border-radius:999px}
.on .badge{background:var(--neon);color:var(--morado)}.soon .badge{background:var(--c);color:#fff}
.course h3{font-size:clamp(22px,2vw,30px);margin:22px 0 10px}.on h3{color:var(--neon)}.soon h3{color:var(--c)}
.course p{line-height:1.55;font-size:15px}
.cl{display:flex;flex-direction:column;gap:10px}
.cl-i{display:flex;align-items:center;gap:16px;padding:14px 20px;border:2.5px solid var(--morado);border-radius:20px;font-weight:700;text-decoration:none;background:#fff;transition:all .2s}
a.cl-i:hover{background:var(--morado);color:var(--neon);transform:translateX(6px)}
.cl-i.lock{border-style:dashed;opacity:.6}
.cl-i .s{margin-left:auto;font-size:12px;text-transform:uppercase;letter-spacing:.06em}
.num{flex:none;width:38px;height:38px;border-radius:50%;background:var(--magenta);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:900}
.soon-box{border:3px dashed var(--magenta);border-radius:30px;padding:clamp(30px,5vw,64px);text-align:center;max-width:760px;margin:0 auto}
.soon-box h2{font-size:clamp(28px,4vw,52px);color:var(--magenta);margin-bottom:14px}
.soon-box p{font-size:clamp(15px,1.3vw,19px);line-height:1.6}
.actions{display:flex;flex-wrap:wrap;gap:12px;margin:22px 0 28px}
.sum h3{font-size:20px;margin-bottom:10px;color:var(--magenta)}.sum p{line-height:1.7;max-width:760px}
.contact{display:flex;flex-wrap:wrap;gap:16px;margin-top:10px}

/* ===== Reproductor ===== */
.player{position:relative;container-type:inline-size;background:#000;border-radius:24px;overflow:hidden;aspect-ratio:16/9;user-select:none;outline:0}
.player:fullscreen{border-radius:0;aspect-ratio:auto}
.player video{width:100%;height:100%;display:block;background:#000}
.subs{position:absolute;left:5%;right:5%;bottom:84px;display:flex;justify-content:center;pointer-events:none}
.subs span{white-space:pre-line;text-align:center;font-weight:700;line-height:1.35;padding:2px 10px;border-radius:6px;font-size:max(12px,calc(var(--fsm,1)*2.6cqw));color:var(--sc,#fff)}
.subs span:empty{display:none}
.subs.bg span{background:rgba(0,0,0,.75)}
.subs:not(.bg) span{text-shadow:0 0 4px #000,0 0 6px #000,1px 1px 3px #000}
.ctrl{position:absolute;left:0;right:0;bottom:0;padding:34px 16px 10px;background:linear-gradient(transparent,rgba(0,0,0,.85));color:#fff;transition:opacity .25s}
.player.idle .ctrl{opacity:0;pointer-events:none}
.player.idle{cursor:none}
.prog{width:100%;accent-color:var(--neon);height:18px;cursor:pointer;background:none;border:0;padding:0}
.row{display:flex;align-items:center;gap:4px}
.row .sp{flex:1}
.cb{background:none;border:0;color:#fff;min-width:40px;height:40px;display:flex;align-items:center;justify-content:center;border-radius:50%;padding:0 6px;transition:background .2s}
.cb:hover{background:rgba(255,255,255,.18)}
.cb svg{width:26px;height:26px}
.cb .ccb{font-weight:900;font-size:12px;border:2px solid #fff;border-radius:6px;padding:1px 5px}
.cb.act .ccb{background:var(--neon);color:var(--morado);border-color:var(--neon)}
.cb .qlab{font-weight:700;font-size:13px;border:2px solid #fff;border-radius:999px;padding:3px 10px}
.vol{width:80px;accent-color:var(--neon);cursor:pointer}
.time{font-size:13px;font-weight:700;margin-left:8px;white-space:nowrap}
.menu{position:absolute;right:12px;bottom:76px;background:rgba(25,0,55,.96);border:2px solid var(--neon);border-radius:18px;padding:14px 16px;color:#fff;min-width:250px;display:none;z-index:6}
.menu.open{display:block}
.menu h4{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--neon);margin:10px 0 8px}.menu h4:first-child{margin-top:0}
.menu .opts{display:flex;flex-wrap:wrap;gap:6px}
.menu .o{background:none;border:2px solid rgba(255,255,255,.4);color:#fff;border-radius:999px;padding:6px 13px;font-weight:700;font-size:13px}
.menu .o.on{background:var(--neon);color:var(--morado);border-color:var(--neon)}
.menu .o.sw{width:30px;height:30px;padding:0;border-radius:50%}
.menu .o.sw.on{outline:3px solid var(--neon);outline-offset:2px}
.menu p{font-size:13px;line-height:1.5}
.noVid[hidden]{display:none!important}
.noVid{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;text-align:center;padding:20px}

/* ===== Administración ===== */
.admtabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:26px}
.admtabs a{text-decoration:none;font-weight:700;padding:10px 22px;border-radius:999px;border:2.5px solid var(--morado)}
.admtabs a.on{background:var(--morado);color:var(--neon)}
.panel{border:3px solid var(--morado);border-radius:24px;padding:22px 24px;margin-bottom:20px}
.panel .g2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:20px}.bar select{width:auto;min-width:240px}
details.cls{border:2.5px solid var(--morado);border-radius:18px;margin-bottom:10px;overflow:hidden}
details.cls summary{cursor:pointer;padding:14px 18px;font-weight:700;display:flex;gap:12px;align-items:center;list-style:none}
details.cls summary::-webkit-details-marker{display:none}
details.cls[open] summary{background:#f6efff}
.cls .in{padding:16px 18px;display:grid;gap:12px}
.pill{font-size:11px;font-weight:900;text-transform:uppercase;padding:4px 10px;border-radius:999px;background:var(--magenta);color:#fff}.pill.g{background:#cfc4de;color:var(--morado)}
.srcrow{display:grid;grid-template-columns:110px 1fr;gap:10px}
.hint{font-size:13px;line-height:1.5;opacity:.85}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:12px 10px;border-bottom:2px solid #eadff7;vertical-align:middle;font-size:14px}
th{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--magenta)}
td input,td select{padding:8px 12px;border-width:2px;border-radius:12px}
.tbl{overflow-x:auto}
.order{border:2.5px solid var(--morado);border-radius:20px;padding:18px 20px;margin-bottom:14px}
.order dl{display:grid;grid-template-columns:150px 1fr;gap:6px 14px;font-size:14px;margin:12px 0}.order dt{font-weight:900;color:var(--magenta)}
.order dd{line-height:1.5;word-break:break-word}
.note{background:#f6efff;border-radius:16px;padding:14px 18px;font-size:13px;line-height:1.6;margin-bottom:22px}
#toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(30px);background:var(--morado);color:var(--neon);font-weight:700;padding:12px 24px;border-radius:999px;opacity:0;pointer-events:none;transition:all .3s;z-index:99}
#toast.show{opacity:1;transform:translateX(-50%)}

@media (max-width:900px){
  .auth{grid-template-columns:1fr}.auth-l{padding:36px 6vw 56px}
  .top{grid-template-columns:auto 1fr;padding:0 4vw}.top .l,.hi{display:none}.top .brand img{height:32px}
  .bs h2,.bs p{max-width:100%}.bs img{display:none}
  .panel .g2{grid-template-columns:1fr}.order dl{grid-template-columns:1fr}
}
</style>
</head>

/* ================== Reproductor ================== */
function initPlayer(root,L){
  var v=$('video',root),srcs=(L.sources||[]).filter(function(s){return s.url}),qi=0,subsEl=$('.subs',root),sspan=$('span',subsEl);
  var pr=DB.get(K.subs,{on:true,size:1,color:'#ffffff',bg:true});
  var prog=$('.prog',root),vol=$('.vol',root),tm=$('.time',root),mCC=$('#mCC',root),mQ=$('#mQ',root),track=null,idle;
  function btn(c){return $('[data-c="'+c+'"]',root)}
  if(!srcs.length){$('.noVid',root).hidden=false}
  else{
    var pq=DB.get(K.q,null),k=srcs.map(function(s){return s.label}).indexOf(pq);if(k>-1)qi=k;
    setSrc(qi,false);
  }
  function setSrc(i,keep){
    var t=keep?v.currentTime:0,pl=keep&&!v.paused;qi=i;v.src=srcs[i].url;$('.qlab',root).textContent=srcs[i].label;
    v.addEventListener('loadedmetadata',function f(){v.removeEventListener('loadedmetadata',f);if(t)v.currentTime=t;if(pl)v.play()});
  }
  /* subtítulos */
  var blob=null;
  if(L.subs){
    blob=URL.createObjectURL(new Blob([L.subs],{type:'text/vtt'}));
    var te=document.createElement('track');te.kind='subtitles';te.label='Español';te.src=blob;v.appendChild(te);track=te.track;track.mode='hidden';
    track.addEventListener('cuechange',draw);
  }
  cleanup.push(function(){v.pause();if(blob)URL.revokeObjectURL(blob);if(document.fullscreenElement)document.exitFullscreen()});
  function draw(){
    if(!track||!pr.on){sspan.textContent='';return}
    var t=[].map.call(track.activeCues||[],function(c){return c.text.replace(/<[^>]+>/g,'')}).join('\n');sspan.textContent=t;
  }
  function styleSubs(){
    root.style.setProperty('--fsm',pr.size);root.style.setProperty('--sc',pr.color);subsEl.classList.toggle('bg',!!pr.bg);
    btn('cc').classList.toggle('act',!!track&&pr.on);draw();
  }
  function savePr(){DB.set(K.subs,pr);styleSubs()}
  styleSubs();
  /* controles */
  function toggle(){if(!srcs.length)return;v.paused?v.play():v.pause()}
  function seek(d){v.currentTime=Math.max(0,Math.min(v.duration||0,v.currentTime+d))}
  function upd(){btn('play').innerHTML=v.paused?I.play:I.pause}
  function closeMenus(){mCC.classList.remove('open');mQ.classList.remove('open')}
  v.addEventListener('play',upd);v.addEventListener('pause',upd);
  v.addEventListener('timeupdate',function(){if(v.duration)prog.value=v.currentTime/v.duration*1000;tm.textContent=fmt(v.currentTime)+' / '+fmt(v.duration)});
  v.addEventListener('loadedmetadata',function(){tm.textContent=fmt(0)+' / '+fmt(v.duration)});
  prog.addEventListener('input',function(){if(v.duration)v.currentTime=prog.value/1000*v.duration});
  vol.addEventListener('input',function(){v.volume=+vol.value;v.muted=v.volume===0;btn('mute').innerHTML=v.muted?I.mute:I.vol});
  function showCtl(){root.classList.remove('idle');clearTimeout(idle);idle=setTimeout(function(){if(!v.paused&&!$('.menu.open',root))root.classList.add('idle')},2600)}
  root.addEventListener('mousemove',showCtl);root.addEventListener('touchstart',showCtl,{passive:true});root.addEventListener('pause',showCtl,true);
  v.addEventListener('click',function(){closeMenus();toggle()});
  root.addEventListener('keydown',function(e){
    if(e.target.tagName==='INPUT')return;
    if(e.key===' '||e.key==='k'){e.preventDefault();toggle()}
    else if(e.key==='ArrowLeft')seek(-10);else if(e.key==='ArrowRight')seek(10);
    else if(e.key==='m')btn('mute').click();else if(e.key==='f')btn('fs').click();
  });
  /* menús */
  function menuCC(){
    var sz=[['S',0.8],['M',1],['L',1.35],['XL',1.8]],cl=['#ffffff','#c8ff00','#ff0098'];
    mCC.innerHTML=(track?'<h4>Subtítulos</h4><div class="opts"><button class="o'+(pr.on?'':' on')+'" data-s="off">Desactivados</button><button class="o'+(pr.on?' on':'')+'" data-s="on">Español</button></div>':'<p>Esta clase todavía no tiene subtítulos.</p>')+
     '<h4>Tamaño</h4><div class="opts">'+sz.map(function(s){return '<button class="o'+(pr.size===s[1]?' on':'')+'" data-z="'+s[1]+'">'+s[0]+'</button>'}).join('')+'</div>'+
     '<h4>Color</h4><div class="opts">'+cl.map(function(c){return '<button class="o sw'+(pr.color===c?' on':'')+'" style="background:'+c+'" data-k="'+c+'" aria-label="Color"></button>'}).join('')+'</div>'+
     '<h4>Fondo</h4><div class="opts"><button class="o'+(pr.bg?' on':'')+'" data-b="1">Con fondo</button><button class="o'+(pr.bg?'':' on')+'" data-b="0">Sin fondo</button></div>';
  }
  function menuQ(){
    mQ.innerHTML='<h4>Calidad</h4>'+(srcs.length?'<div class="opts">'+srcs.map(function(s,i){return '<button class="o'+(i===qi?' on':'')+'" data-q="'+i+'">'+esc(s.label)+'</button>'}).join('')+'</div>':'<p>No hay video.</p>');
  }
  mCC.addEventListener('click',function(e){
    var b=e.target.closest('button');if(!b)return;
    if(b.dataset.s)pr.on=b.dataset.s==='on';
    if(b.dataset.z)pr.size=+b.dataset.z;
    if(b.dataset.k)pr.color=b.dataset.k;
    if(b.dataset.b)pr.bg=b.dataset.b==='1';
    savePr();menuCC();
  });
  mQ.addEventListener('click',function(e){
    var b=e.target.closest('button');if(!b||b.dataset.q==null)return;
    DB.set(K.q,srcs[+b.dataset.q].label);setSrc(+b.dataset.q,true);menuQ();
  });
  root.addEventListener('click',function(e){
    var b=e.target.closest('[data-c]');if(!b)return;var c=b.dataset.c;
    if(c==='play')toggle();else if(c==='back')seek(-10);else if(c==='fwd')seek(10);
    else if(c==='mute'){v.muted=!v.muted;b.innerHTML=v.muted?I.mute:I.vol}
    else if(c==='fs'){if(document.fullscreenElement)document.exitFullscreen();else (root.requestFullscreen||root.webkitRequestFullscreen).call(root)}
    else if(c==='cc'){var o=mCC.classList.contains('open');closeMenus();if(!o){menuCC();mCC.classList.add('open')}}
    else if(c==='q'){var o2=mQ.classList.contains('open');closeMenus();if(!o2){menuQ();mQ.classList.add('open')}}
  });
}

   c.classes.map(function(k){
     var rows=[0,1,2].map(function(i){var s=k.sources[i]||{label:'',url:''};
       return '<div class="srcrow"><input placeholder="Calidad (720p)" data-f="k.'+k.n+'.src.'+i+'.label" value="'+esc(s.label)+'"><input placeholder="Ruta o enlace del video (video/clase1-720.mp4)" data-f="k.'+k.n+'.src.'+i+'.url" value="'+esc(s.url)+'"></div>'}).join('');
     return '<details class="cls"><summary><span class="num" style="width:32px;height:32px">'+k.n+'</span>'+esc(k.title)+'<span class="pill'+(k.published?'':' g')+'" style="margin-left:auto">'+(k.published?'Visible':'Oculta')+'</span></summary><div class="in">'+
      '<div class="fld"><label>Título de la clase</label><input data-f="k.'+k.n+'.title" value="'+esc(k.title)+'"></div>'+
      '<div class="fld"><label>Resumen de la clase</label><textarea rows="3" data-f="k.'+k.n+'.summary">'+esc(k.summary)+'</textarea></div>'+
      '<label><input type="checkbox" data-f="k.'+k.n+'.published"'+(k.published?' checked':'')+'> Visible para los alumnos (se puede hacer click)</label>'+
      '<div><label>Video (puedes poner varias calidades)</label>'+rows+'<p class="hint">Escribe la ruta del archivo dentro de la web (por ejemplo <b>video/clase2-720.mp4</b>) o un enlace directo a un .mp4.</p></div>'+
      '<div><label>Subtítulos (.vtt o .srt)</label><input type="file" accept=".vtt,.srt" data-file="'+k.n+'"><p class="hint" id="sn'+k.n+'">'+(k.subs?'Subtítulos cargados: '+esc(k.subsName)+' ':'Sin subtítulos. ')+'</p>'+(k.subs?'<button class="btn b-out" data-act="rmsubs" data-n="'+k.n+'" style="padding:8px 16px;font-size:13px">Quitar subtítulos</button>':'')+'</div>'+
      '<div><button class="btn b-out" data-act="delclass" data-n="'+k.n+'" style="padding:8px 16px;font-size:13px">Eliminar esta clase</button></div></div></details>';
   }).join('')+'<button class="btn b-mag" data-act="addclass">+ Añadir clase</button>';
}
function admUsers(){
  var me_=me();
  return '<div class="panel tbl"><table><thead><tr><th>Nombre</th><th>Correo / usuario</th><th>Rol</th><th>Registro</th><th>Acciones</th></tr></thead><tbody>'+
   users().map(function(u){
     return '<tr><td><input data-u="'+u.id+'.name" value="'+esc(u.name)+'"></td><td>'+esc(u.email)+'</td>'+
      '<td><select data-u="'+u.id+'.role"'+(u.id===me_.id?' disabled':'')+'><option value="user"'+(u.role==='user'?' selected':'')+'>Usuario</option><option value="admin"'+(u.role==='admin'?' selected':'')+'>Admin</option></select></td>'+
      '<td>'+new Date(u.created).toLocaleDateString('es')+'</td><td style="white-space:nowrap"><button class="btn b-out" style="padding:8px 14px;font-size:13px" data-act="pass" data-id="'+u.id+'">Nueva contraseña</button> '+
      (u.id===me_.id?'':'<button class="btn b-mag" style="padding:8px 14px;font-size:13px" data-act="deluser" data-id="'+u.id+'">Eliminar</button>')+'</td></tr>';
   }).join('')+'</tbody></table></div>';
}
var LBL={nombre:'Nombre',proyecto:'Proyecto',presupuesto:'Presupuesto',pais:'País',telefono:'Teléfono',correo:'Correo'};
function admOrders(){
  var o=DB.get(K.orders,[]);
  if(!o.length)return '<div class="panel"><p>Todavía no hay pedidos. Las solicitudes que se envíen desde el formulario "Inicia tu proyecto" de la web aparecerán aquí.</p></div>';
  return o.map(function(r){
    var tel=String(r.telefono||'').replace(/\D/g,'');
    return '<div class="order"><div class="bar" style="margin:0"><b>'+esc(r.nombre)+'</b><span class="hint">'+new Date(r.fecha).toLocaleString('es')+'</span>'+
     '<select data-o="'+r.id+'" style="margin-left:auto;width:auto"><option'+(r.estado==='Nuevo'?' selected':'')+'>Nuevo</option><option'+(r.estado==='En proceso'?' selected':'')+'>En proceso</option><option'+(r.estado==='Terminado'?' selected':'')+'>Terminado</option></select></div><dl>'+
     Object.keys(LBL).map(function(k){return '<dt>'+LBL[k]+'</dt><dd>'+esc(r[k])+'</dd>'}).join('')+'</dl>'+
     (tel?'<a class="btn b-mag" target="_blank" rel="noopener" href="https://wa.me/'+tel+'">'+I.wa+'Escribirle</a> ':'')+
     '<button class="btn b-out" data-act="delorder" data-id="'+r.id+'">Eliminar</button></div>';
  }).join('');
}
function setPath(c,path,val){
  var p=path.split('.');
  if(p[0]==='c'){c[p[1]]=val;return}
  var k=c.classes.filter(function(x){return x.n===+p[1]})[0];if(!k)return;
  if(p[2]==='src'){while(k.sources.length<=+p[3])k.sources.push({label:'',url:''});k.sources[+p[3]][p[4]]=val}
  else k[p[2]]=val;
}

/* ================== Eventos globales ================== */
document.addEventListener('submit',function(e){if(e.target.id==='authForm'){e.preventDefault();authSubmit()}});
document.addEventListener('change',function(e){
  var t=e.target;
  if(t.dataset.f){
    var cs=courses(),c=cs.filter(function(x){return x.id===adm.course})[0];
    setPath(c,t.dataset.f,t.type==='checkbox'?t.checked:t.value);saveCourses(cs);
    if(t.dataset.f.slice(-9)==='published')route();
  }else if(t.dataset.file){
    var f=t.files[0];if(!f)return;var rd=new FileReader();
    rd.onload=function(){
      var s=String(rd.result).replace(/^\uFEFF/,'');
      if(!/^WEBVTT/.test(s))s='WEBVTT\n\n'+s.replace(/\r/g,'').replace(/(\d\d:\d\d:\d\d),(\d{3})/g,'$1.$2');
      var cs=courses(),c=cs.filter(function(x){return x.id===adm.course})[0],k=c.classes.filter(function(x){return x.n===+t.dataset.file})[0];
      k.subs=s;k.subsName=f.name;saveCourses(cs);route();
    };
    rd.readAsText(f);
  }else if(t.dataset.u){
    var p=t.dataset.u.split('.'),l=users(),u=l.filter(function(x){return x.id===p[0]})[0];u[p[1]]=t.value;DB.set(K.users,l);toast('Guardado');
  }else if(t.dataset.o){
    var o=DB.get(K.orders,[]);o.forEach(function(r){if(String(r.id)===t.dataset.o)r.estado=t.value});DB.set(K.orders,o);toast('Guardado');
  }else if(t.dataset.act==='selcourse'){adm.course=t.value;route()}
});
document.addEventListener('click',function(e){
  var b=e.target.closest('[data-act]');if(!b||b.tagName==='SELECT')return;var a=b.dataset.act;
  if(a==='logout'){DB.set(K.ses,null);location.hash='#/';route()}
  else if(a==='mode'){mode=b.dataset.m;viewAuth()}
  else if(a==='google')toast('El acceso con Google se activará cuando conectemos la base de datos.');
  else if(a==='newcourse'){var n=prompt('Nombre del nuevo curso:');if(n){var cs=courses();var id='c'+Date.now();cs.push({id:id,title:n,summary:'',available:false,classes:[]});saveCourses(cs);adm.course=id;route()}}
  else if(a==='delcourse'){if(confirm('¿Eliminar este curso completo?')){var cs2=courses().filter(function(x){return x.id!==adm.course});saveCourses(cs2);adm.course=cs2[0]&&cs2[0].id;route()}}
  else if(a==='addclass'){var cs3=courses(),c=cs3.filter(function(x){return x.id===adm.course})[0],n2=c.classes.length+1;c.classes.push({n:n2,title:'Clase '+n2,summary:'',published:false,sources:[],subs:'',subsName:''});saveCourses(cs3);route()}
  else if(a==='delclass'){if(confirm('¿Eliminar esta clase?')){var cs4=courses(),c4=cs4.filter(function(x){return x.id===adm.course})[0];c4.classes=c4.classes.filter(function(x){return x.n!==+b.dataset.n});c4.classes.forEach(function(x,i){x.n=i+1});saveCourses(cs4);route()}}
  else if(a==='rmsubs'){var cs5=courses(),c5=cs5.filter(function(x){return x.id===adm.course})[0],k5=c5.classes.filter(function(x){return x.n===+b.dataset.n})[0];k5.subs='';k5.subsName='';saveCourses(cs5);route()}
  else if(a==='pass'){var np=prompt('Nueva contraseña (mínimo 6 caracteres):');if(np&&np.length>=6){var l=users();sha(np).then(function(h){l.filter(function(x){return x.id===b.dataset.id})[0].hash=h;DB.set(K.users,l);toast('Contraseña actualizada')})}else if(np)toast('Mínimo 6 caracteres')}
  else if(a==='deluser'){if(confirm('¿Eliminar este usuario?')){DB.set(K.users,users().filter(function(x){return x.id!==b.dataset.id}));route()}}
  else if(a==='delorder'){if(confirm('¿Eliminar este pedido?')){DB.set(K.orders,DB.get(K.orders,[]).filter(function(x){return String(x.id)!==b.dataset.id}));route()}}
});
seed().then(route);
</script>
