<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cursos · Cosmos Agencia Creativa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{--neon:#c8ff00;--magenta:#ff0098;--azul:#0068ff;--morado:#3e007a}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{font-family:'Montserrat',sans-serif;font-weight:500;color:var(--morado);background:#fff;min-height:100vh}
a{color:inherit}
h1,h2,h3{font-weight:900;text-transform:uppercase;line-height:1.08}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;text-decoration:none;font-weight:700;font-size:15px;padding:12px 24px;border-radius:999px;transition:transform .2s;cursor:pointer;font-family:inherit}
.btn:hover{transform:translateY(-2px)}.btn.off{opacity:.45;pointer-events:none}
.btn svg{width:20px;height:20px}
.b-mag{background:var(--magenta);color:#fff}.b-mor{background:var(--morado);color:var(--neon)}.b-out{background:#fff;color:var(--morado);border:2.5px solid var(--morado)}.b-neon{background:var(--neon);color:var(--morado)}
.top{position:sticky;top:0;z-index:30;height:76px;background:#fff;border-bottom:3px solid var(--morado);display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:0 3vw}
.top .brand img{height:40px;display:block}
.top .l a{font-weight:700;text-decoration:none;font-size:15px}.top .l a:hover{color:var(--magenta)}
.top .r{display:flex;gap:12px;justify-content:flex-end}
.wrap{max-width:1200px;margin:0 auto;padding:40px 5vw 90px}
.crumb{font-weight:700;color:var(--magenta);text-transform:uppercase;font-size:13px;letter-spacing:.08em;margin-bottom:8px}
.page-t{font-size:clamp(30px,4.6vw,64px);margin-bottom:14px}.page-t span{color:var(--magenta)}
.lead{font-size:clamp(15px,1.25vw,19px);line-height:1.65;max-width:720px;margin-bottom:34px}
.av{position:relative;flex:none;width:var(--s,56px);height:var(--s,56px);border-radius:50%;background:var(--magenta);color:#fff;display:grid;place-items:center;overflow:hidden;font-weight:900;font-size:calc(var(--s,56px)*.42)}
.av img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.badge{display:inline-block;font-weight:900;text-transform:uppercase;font-size:12px;letter-spacing:.06em;padding:7px 14px;border-radius:999px}
.badge.on{background:var(--neon);color:var(--morado)}.badge.soon{background:var(--c,var(--azul));color:#fff}

/* Catálogo */
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:28px}
.cc{display:flex;flex-direction:column;border:3px solid var(--c,var(--morado));border-radius:28px;overflow:hidden;background:#fff}
.cc.on{--c:var(--morado)}
.thumb{display:block;aspect-ratio:16/9;background:var(--morado);position:relative;overflow:hidden}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb .fb{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}.thumb .fb img{width:34%;height:auto;object-fit:contain}
.cb{padding:22px 24px 24px;display:flex;flex-direction:column;gap:12px;flex:1}
.cb h3{font-size:clamp(20px,1.8vw,26px);color:var(--c,var(--morado))}
.cb p{font-size:15px;line-height:1.55}
.tch{display:flex;align-items:center;gap:10px;font-size:13px;line-height:1.3}.tch b{display:block;font-size:14px}
.foot{margin-top:auto;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-top:6px}
.price{font-weight:900;font-size:clamp(20px,1.8vw,26px)}.price small{display:block;font-size:12px;font-weight:700;color:var(--magenta);text-transform:uppercase;letter-spacing:.06em}

/* Detalle */
.dgrid{display:grid;grid-template-columns:1.5fr 1fr;gap:40px;align-items:start}
.gal-main{aspect-ratio:16/9;border:3px solid var(--morado);border-radius:28px;overflow:hidden;background:var(--morado);position:relative}
.gal-main img{width:100%;height:100%;object-fit:cover;display:block}
.gal-main .fb{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}.gal-main .fb img{width:30%;height:auto;object-fit:contain}
.gal-main>img,.thumb>img{position:relative;z-index:1}
.thumbs{display:flex;gap:10px;margin-top:12px}
.thumbs button{width:92px;aspect-ratio:16/9;border:3px solid transparent;border-radius:14px;overflow:hidden;padding:0;background:none;cursor:pointer;opacity:.7}
.thumbs button.on{border-color:var(--magenta);opacity:1}
.thumbs img{width:100%;height:100%;object-fit:cover;display:block}
.desc{margin-top:30px}.desc h3{color:var(--magenta);font-size:20px;margin-bottom:12px}
.desc p{line-height:1.75;font-size:clamp(15px,1.2vw,18px);margin-bottom:24px}
.cont{list-style:none;display:flex;flex-direction:column;gap:8px}
.cont li{display:flex;gap:12px;align-items:center;font-weight:700;font-size:15px}
.cont li::before{content:"";flex:none;width:10px;height:10px;border-radius:50%;background:var(--magenta)}
.aside{position:sticky;top:96px;display:flex;flex-direction:column;gap:20px}
.box{border:3px solid var(--morado);border-radius:28px;padding:26px 26px 28px}
.box.buy{background:var(--morado);color:#fff}
.box.buy .price{color:var(--neon);font-size:clamp(30px,3vw,44px);margin:14px 0 18px}.box.buy .price small{color:#fff}
.box.buy .btn{width:100%}
.box.buy p{font-size:13px;line-height:1.6;margin-top:14px}
.tbox{display:flex;align-items:center;gap:16px}.tbox small{font-weight:700;color:var(--magenta);text-transform:uppercase;font-size:12px;letter-spacing:.08em;display:block;margin-bottom:4px}
.tbox b{font-size:20px;display:block}
@media (max-width:900px){.top{grid-template-columns:auto 1fr;padding:0 4vw}.top .l{display:none}.top .brand img{height:32px}.dgrid{grid-template-columns:1fr}.aside{position:static}}
</style>
</head>
<body>
<header class="top">
  <div class="l"><a href="index.html">← Volver a la web</a></div>
  <a class="brand" href="index.html"><img src="img/logo-color.png" alt="Cosmos Agencia Creativa"></a>
  <div class="r" id="who"></div>
</header>
<main class="wrap" id="view"></main>

<script src="datos.js"></script>
<script>
var WAI='<svg viewBox="0 0 24 24" fill="currentColor"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413Z"/></svg>';
var view=document.getElementById('view'),U=me();
document.getElementById('who').innerHTML=U?'<a class="btn b-mor" href="portal.html">Mi portal</a>':'<a class="btn b-mag" href="portal.html">Iniciar sesión</a>';
var COLORS=['var(--azul)','var(--magenta)'];

function thumb(src){return src?'<img src="'+esc(src)+'" alt="" onerror="this.remove()">':''}
function fb(){return '<div class="fb"><img src="img/estrella-neon.png" alt=""></div>'}
function teacherRow(t){return t&&t.name?'<div class="tch">'+avatar(t,38)+'<span><b>'+esc(t.name)+'</b>'+esc(t.role)+'</span></div>':'<div class="tch" style="opacity:.6">Profesor por anunciar</div>'}

function list(cs){
  var k=0;
  view.innerHTML='<p class="crumb">Cosmos Cursos</p><h1 class="page-t">Catálogo de <span>cursos</span></h1>'+
   '<p class="lead">Aprende con el equipo de Cosmos, a tu ritmo y sin estrés. Cualquiera puede ver el catálogo; si ya compraste un curso, lo encuentras en tu portal.</p>'+
   '<div class="grid">'+cs.map(function(c){
     var own=c.available&&hasAccess(U,c.id),col=c.available?'':COLORS[k++%2],img=(c.images||[]).filter(Boolean)[0];
     var right=!c.available?'<span class="price"><small>Próximamente</small></span>':own?'<a class="btn b-neon" style="background:var(--neon)" href="portal.html#/cursos/'+esc(c.id)+'">Ver ahora</a>':'<span class="price"><small>Precio</small>'+esc(price(c))+'</span>';
     return '<article class="cc '+(c.available?'on':'')+'" style="'+(col?'--c:'+col:'')+'"><a class="thumb" href="#/'+esc(c.id)+'">'+fb()+thumb(img)+'</a><div class="cb">'+
      '<span><span class="badge '+(c.available?'on':'soon')+'">'+(c.available?(own?'Tu curso':'Disponible'):'Próximamente')+'</span></span><h3>'+esc(c.title)+'</h3><p>'+esc(c.summary)+'</p>'+teacherRow(c.teacher)+
      '<div class="foot">'+right+'<a class="btn b-mor" href="#/'+esc(c.id)+'">Ver más</a></div></div></article>';
   }).join('')+'</div>';
}

function detail(c){
  var imgs=(c.images||[]).filter(Boolean),own=c.available&&hasAccess(U,c.id),t=c.teacher||{};
  var buy;
  if(!c.available)buy='<div class="box buy"><span class="badge soon" style="--c:var(--magenta)">Próximamente</span><p style="font-size:15px;margin-top:16px">Estamos preparando este curso. ¡Muy pronto estará disponible!</p><div style="margin-top:18px"><a class="btn b-neon" target="_blank" rel="noopener" href="'+wa('Hola, quiero saber cuándo estará disponible el '+c.title)+'">'+WAI+'Preguntar por este curso</a></div></div>';
  else if(own)buy='<div class="box buy"><span class="badge on">Tu curso</span><p style="font-size:15px;margin:16px 0 18px">Ya tienes acceso a este curso. ¡A aprender!</p><a class="btn b-neon" href="portal.html#/cursos/'+esc(c.id)+'">Ver ahora</a></div>';
  else buy='<div class="box buy"><span class="badge on">Disponible</span><div class="price"><small>Precio</small>'+esc(price(c))+'</div><a class="btn b-neon" target="_blank" rel="noopener" href="'+wa('Hola, quiero comprar el '+c.title+'. ¿Me das más información?')+'">'+WAI+'Comprar curso</a><p>Escríbenos por WhatsApp para completar tu compra. Cuando verifiquemos tu pago, te damos acceso al curso en tu portal.</p></div>';
  view.innerHTML='<a class="btn b-out" href="#/" style="margin-bottom:26px">← Catálogo de cursos</a>'+
   '<p class="crumb">Curso</p><h1 class="page-t" style="font-size:clamp(28px,4vw,56px)">'+esc(c.title)+'</h1><p class="lead">'+esc(c.summary)+'</p>'+
   '<div class="dgrid"><div><div class="gal-main" id="gm">'+fb()+(imgs[0]?thumb(imgs[0]):'')+'</div>'+
   (imgs.length>1?'<div class="thumbs">'+imgs.map(function(s,i){return '<button class="'+(i?'':'on')+'" data-i="'+i+'" aria-label="Imagen '+(i+1)+'"><img src="'+esc(s)+'" alt=""></button>'}).join('')+'</div>':'')+
   '<div class="desc">'+(c.description?'<h3>Sobre este curso</h3><p>'+esc(c.description)+'</p>':'')+
   (c.classes&&c.classes.length?'<h3>Contenido del curso ('+c.classes.length+' clases)</h3><ul class="cont">'+c.classes.map(function(k){return '<li>'+esc(k.title)+'</li>'}).join('')+'</ul>':'')+'</div></div>'+
   '<aside class="aside">'+buy+'<div class="box"><div class="tbox">'+(t.name?avatar(t,76)+'<div><small>Tu profesor</small><b>'+esc(t.name)+'</b>'+esc(t.role)+'</div>':'<div><small>Profesor</small><b>Por anunciar</b></div>')+'</div></div></aside></div>';
  var gm=document.getElementById('gm');
  [].forEach.call(document.querySelectorAll('.thumbs button'),function(b){b.onclick=function(){
    [].forEach.call(document.querySelectorAll('.thumbs button'),function(x){x.classList.remove('on')});b.classList.add('on');
    var im=gm.querySelector('img:not(.fbi)');gm.innerHTML=fb()+thumb(imgs[+b.dataset.i]);
  }});
}

function route(){
  var id=(location.hash||'').replace(/^#\/?/,''),cs=courses(),c=cs.filter(function(x){return x.id===id})[0];
  if(c)detail(c);else list(cs);
  window.scrollTo(0,0);
}
window.addEventListener('hashchange',route);route();
</script>
</body>
</html>
